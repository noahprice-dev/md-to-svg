[package]
name = "md_to_svg"
version = "0.2.3"
edition = "2024"
description = "Highly configurable CLI tool to translate Markdown Documents into SVG files."
authors = ["Noah Price: nprice@pricemail.ca"]
repository = "https://github.com/noahprice-dev/md-to-svg"


[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15.27", features = ["toml"] }
cosmic-text = "0.19.0"
markdown = "1.0.0"
regex = "1.13.1"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.1.8", features = ["parse", "serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
