[canvas]
width = 600
height = 800
padding = "0"
bg_color = "#FFFFFF"

[text-style]
font-size = 16
line_height_factor = 1.5
paragraph_spacing_em = 0.6
bullet_indent_em = 1.5
bullet_char = "•"

[header_opts]
header_margin_top = 0
header_margin_bot = 0

[header_opts.header_scales]
# Header Level to Font Size Scale Ratio
1 = 2.0
2 = 1.6
3 = 1.3
4 = 1.1
5 = 1.0
6 = 1.0
